name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Test No-asm
      run: go test -tags=noasm ./...

    - name: Test No-unsafe
      run: go test -tags=nounsafe ./...

    - name: Test No-unsafe, noasm
      run: go test -tags="nounsafe,noasm" ./...

    - name: Test purego
      run: go test -tags="purego" ./...
      
    - name: Test Race 1 CPU
      env:
        CGO_ENABLED: 1
      run: go test -cpu=1 -short -race -tags=nounsafe -v ./...

    - name: Test Race 4 CPU
      env:
        CGO_ENABLED: 1
      run: go test -cpu=4 -short -race -tags=nounsafe -v ./...

  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.x

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Generate
      working-directory: ./_generate
      run: go generate -v -x ./...

    - name: Git Status
      run: |
        git diff
        test -z "$(git status --porcelain)"

  build-special:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.x

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: fmt
      run: diff <(gofmt -d .) <(printf "")

    - name: asmfmt
      run: diff <(go run github.com/klauspost/asmfmt/cmd/asmfmt@v1.3.2 -d $(git ls-files '*.s')) <(printf "")

    - name: fix
      run: diff <(go fix -diff ./...) <(printf "")

    - name: Test 386
      run: GOOS=linux GOARCH=386 go test -short ./...

    - name: Build mz
      run: go build github.com/minio/minlz/cmd/mz&&./mz c -verify -o=comp.mz mz&&./mz d -rm comp.mz&&rm ./mz&&rm comp

    - name: goreleaser deprecation
      run: curl -sfL https://git.io/goreleaser | VERSION=v2.18.2 sh -s -- check

    - name: goreleaser snapshot
      run: curl -sL https://git.io/goreleaser | VERSION=v2.18.2 sh -s -- --snapshot --clean

    - name: Test GOAMD64 v3
      env:
        GOAMD64: v3
      shell: bash {0}
      run: go test . -test.run=None;if [ $? -eq 0 ]; then go test .; else true; fi

    - name: Test GOAMD64 v4
      env:
        GOAMD64: v4
      shell: bash {0}
      run: go test . -test.run=None;if [ $? -eq 0 ]; then go test .; else true; fi

  fuzz:
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        tags: [ '', 'nounsafe', '"noasm,nounsafe"' ]
        tests: ['FuzzEncodingBlocks', 'FuzzDecodeBlock', 'FuzzDecodeSIMD', 'FuzzStreamEncode', 'FuzzStreamDecode', 'FuzzCompressedSearchRoundtrip', 'FuzzDecodeCompressedSearchChunk']
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # The pivco fuzzers compare the kernel tiers; the NEON kernels get no other direct fuzzing.
        # noasm leaves only the generic tier.
        include:
          # Anchored: FuzzDecodeBlock also matches FuzzDecodeBlockFixed, and is a root fuzzer name.
          - { os: ubuntu-24.04-arm, tags: '', pkg: ./internal/pivco, tests: '^FuzzDecodeBlock$' }
          - { os: ubuntu-24.04-arm, tags: nounsafe, pkg: ./internal/pivco, tests: '^FuzzDecodeBlock$' }
          - { os: ubuntu-24.04-arm, tags: '', pkg: ./internal/pivco, tests: FuzzDecodeBlockFixed }
          - { os: ubuntu-24.04-arm, tags: nounsafe, pkg: ./internal/pivco, tests: FuzzDecodeBlockFixed }
          - { os: ubuntu-24.04-arm, tags: '', pkg: ./internal/pivco, tests: FuzzRoundTripBlock }
          - { os: ubuntu-24.04-arm, tags: nounsafe, pkg: ./internal/pivco, tests: FuzzRoundTripBlock }
          - { os: ubuntu-24.04-arm, tags: '', pkg: ./internal/pivco, tests: FuzzTable }
          - { os: ubuntu-24.04-arm, tags: nounsafe, pkg: ./internal/pivco, tests: FuzzTable }
          - { os: ubuntu-24.04-arm, tags: '', pkg: ./internal/pivco/kernel, tests: FuzzExec }
          - { os: ubuntu-24.04-arm, tags: nounsafe, pkg: ./internal/pivco/kernel, tests: FuzzExec }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # FuzzEncodingBlocks skips itself without these files, which still reports PASS.
      - name: Cache benchmark data
        if: matrix.tests == 'FuzzEncodingBlocks'
        uses: actions/cache@v6.1.0
        with:
          path: testdata/bench
          key: benchdata-v1

      # -download is a flag of the root package's tests.
      - name: ${{ matrix.pkg || 'mz' }}/${{ matrix.tests }}/${{ matrix.tags }}
        run: go test -tags=${{ matrix.tags }} -run=none -fuzz=${{ matrix.tests }} -fuzztime=3m -test.fuzzminimizetime=100ms ${{ matrix.pkg || '-download' }}
